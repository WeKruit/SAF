[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prediction-market"
version = "0.1.0"
description = "Governed prediction-market research program"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "cryptography",
    "duckdb",
    "httpx",
    "pandas",
    "pyarrow",
    "pydantic",
    "PyYAML",
    "scikit-learn",
    "websockets",
    "xgboost==3.3.0",
    "zstandard",
]

[project.scripts]
audit-pmxt = "prediction_market.cli.audit_pmxt:main"
pm-data-store = "prediction_market.cli.pm_data_store:main"
publish-x13-dashboard = "prediction_market.cli.publish_x13_dashboard:main"
record-markets = "prediction_market.cli.record_markets:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
research = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.2",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
    "papermill==2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
