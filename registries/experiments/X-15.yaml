experiment_card:
  id: X-15
  name: NFL trades-only multi-landmark taker signal
  owner_team: C+D2+E+H
  status: registered
  hypothesis: A directionally consistent taker signal measured at multiple frozen NFL game landmarks on 153 development games may generalize to an independently sealed 81-game holdout.
  data:
    - source: nflverse play-by-play through the verified X-13 single-game bundles
      version: github_release_id:58152862@2026-02-12T10:25:26Z
      pit_basis: Game-state and event fields are inherited from immutable X-13 bundle hashes and remain source-time only.
    - source: nflverse fastrmodels no-spread reference through the verified X-13 historical-reference manifest
      version: archive_commit:9f2495fdb4943087ca663d96706eb5df7973aff4
      pit_basis: The frozen retrospective reference manifest is diagnostic only and does not prove live availability.
    - source: Kalshi official historical trades
      version: official-rest-20260723
      pit_basis: Exchange trade timestamps and the fixed fetch cutoff remain distinct.
    - source: Polymarket official public trades
      version: public-api-20260723
      pit_basis: Exchange event timestamps and the fixed fetch cutoff remain distinct.
  method: Join verified X-13 NFL game-state and fastrmodels reference observations to actual historical trades at the frozen landmark set, then infer residual taker direction. Develop and report the signal on exactly 153 games; keep the independently selected 81-game holdout sealed and unread. Oddpool and order-book state are excluded. The holdout may be read only after a formal evaluation policy is locked and the formal scope is authorized by amendment.
  leakage_checks:
    - Development and holdout game identities are disjoint and frozen before any holdout reaction access.
    - Holdout reaction data remains sealed and unread until the formal holdout policy lock is resolved.
    - Sports state and reference inputs are restricted to the verified X-13 manifests; the market side uses actual trades only, while order-book state and Oddpool data are excluded.
    - Every landmark and taker-direction rule is frozen before formal holdout access.
  split: Exactly 153 development games and 81 independently sealed unread holdout games.
  metrics: [landmark coverage, signed taker imbalance, directional consistency by landmark, clustered game-level uncertainty]
  pass_criteria: Development output is labeled PRELIMINARY_NON_EXECUTABLE and reports the frozen metrics without a formal holdout or execution claim.
  fail_criteria: Any holdout access before the formal policy lock, any Oddpool or order-book input, any split-count drift, or any post-access signal or landmark change invalidates the formal evaluation.
  cost_estimate: {compute: bounded trades-only NFL study, human_days: unresolved}
