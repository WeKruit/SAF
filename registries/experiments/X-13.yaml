experiment_card:
  id: X-13
  name: NFL 20-game source-time event and historical market exploration
  owner_team: C+D2+E+H
  status: registered
  hypothesis: Frozen finalized NFL information episodes may exhibit repeatable source-time price-path associations across Polymarket and Kalshi after game state contract identity and timestamp uncertainty are audited independently.
  data:
    - source: nflverse 2025 play-by-play
      version: unresolved:source_manifest_bundle
      pit_basis: source-reported play time represented as an uncertainty interval
    - source: nflverse participation derived from FTN
      version: unresolved:source_manifest_bundle
      pit_basis: postgame participation rows with no exact substitution or injury timestamp claim
    - source: Polymarket official public market metadata and historical trades
      version: unresolved:source_manifest_bundle
      pit_basis: exchange source timestamp with fetch provenance
    - source: Kalshi official historical markets trades and one-minute candles
      version: unresolved:source_manifest_bundle
      pit_basis: exchange source timestamp and candle interval with fetch provenance
  method: Build deterministic full-depth replay contract and market timelines for exactly twenty frozen 2025 season regular and postseason games then report only preregistered source-time associations and case series.
  leakage_checks:
    - Game selection and event taxonomy are frozen without inspecting market price direction.
    - Raw objects contract universe source-time semantics horizons and analysis whitelist are content-addressed before association evaluation.
    - No future play revised postgame feature or later market observation may enter an earlier episode state.
    - Same-second source intervals remain unordered and contaminated windows are excluded from isolated-event estimates.
  split: Fixed Core-12 plus Rare-enrichment-8 sample; game-cluster bootstrap and leave-one-game-out stability only; not league-representative incidence
  metrics: [eligible episode count, source-time signed price change, first-trade path, horizon VWAP, maximum excursion, overshoot and reversal candidate, cross-venue directional concordance, game-cluster bootstrap interval, leave-one-game-out stability]
  pass_criteria: Publish all twenty deterministic replays and complete source-relative market inventories with immutable hashes and explicitly bounded timestamp ambiguity; qualifying estimates must satisfy preregistered minimum game and episode counts.
  fail_criteria: Any missing terminal pagination proof unknown contract dependency raw hash mismatch unresolved binding future feature fabricated quote or unregistered analysis invalidates the affected artifact and blocks atomic batch publication.
  cost_estimate: {compute: bounded local batch plus public REST capture, human_days: unresolved}
  dependencies: []
  registered_at: '2026-07-24'
  result_acceptance_not_before: '2026-07-25T04:40:00Z'
  due_gate: null
  results_ref: []
  promotion_decision: ''
  execution_authorized: true
  completion_required_scopes: [preliminary_source_time_only]
  authorization_scopes:
