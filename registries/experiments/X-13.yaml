      required_result_label: PRELIMINARY
      required_lock_ids: [game_sample_and_bindings, contract_universe, source_time_interval_semantics, analysis_whitelist, h_split_approval, source_manifest_bundle]
      input_binding:
        result_class: poc
        dataset_ids: [DS-KALSHI-HISTORICAL, DS-NFLVERSE, DS-NFLVERSE-PARTICIPATION, DS-POLYMARKET-PUBLIC]
