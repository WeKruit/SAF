    - {id: contract_universe, status: resolved, reason: All contracts whose settlement depends only on one target game are analysis candidates; cross-game MVE is inventory only.}
    - {id: source_time_interval_semantics, status: resolved, reason: Game seconds trade seconds and Kalshi one-minute candles remain explicit intervals with no invented within-interval order.}
    - {id: analysis_whitelist, status: resolved, reason: Horizons delay scenarios event families minimum counts contamination policy and allowed interactions are frozen.}
