experiment_card:
  id: X-14
  name: NFL prospective game-feed and market-L2 association
  owner_team: B+C+D2+H
  status: registered
  hypothesis: A frozen prospective NFL game and complete single-game market universe can be captured with independently preserved source and local receive times so that event-to-market association can later be measured without historical timestamp ambiguity.
  data:
    - source: Prospective NFL game feed
      version: unresolved:sports_feed_and_timestamp_contract
      pit_basis: provider source-received time plus local receive time and explicit play revision
    - source: Polymarket public market WebSocket
      version: unresolved:polymarket_single_game_token_universe
      pit_basis: exchange source time plus local receive time within explicit connection epochs
    - source: Kalshi authenticated live orderbook WebSocket
      version: blocked:kalshi_credentials
      pit_basis: exchange source time plus local receive time within explicit connection epochs
  method: Freeze one game by UTC scheduled start and ordered away and home teams then capture every Polymarket token whose settlement depends only on that game and conditionally capture exact Kalshi event markets when credentials exist. Persist snapshots deltas BBO trades and play revisions in immutable hourly segments; reconnects or gaps start new epochs and no gap is bridged.
  leakage_checks:
    - Stable venue IDs are bound by UTC scheduled start and ordered teams; title matching and venue date suffixes are not primary identity.
    - Market creation metadata recorder start resolution and every source and local receive timestamp remain distinct.
    - Historical trades-only observations and prospective L2 observations cannot enter one association input.
    - No association result is accepted before the complete game and market resolution are observed.
  split: n.a. prospective capture and measurement; no predictive model fitting
  metrics: [capture coverage by event kind, hourly segment count, connection epoch count, sequence gap count, source-local receive delta distribution, play revision count, market-resolution coverage]
  pass_criteria: The frozen session has a complete single-game token inventory creation metadata continuous immutable capture from its first governed snapshot through resolution explicit gap epochs and a complete sports play-revision feed with both timestamp layers.
  fail_criteria: Missing token coverage missing source or local receive time an unsegmented reconnect a bridged sequence gap a missing play revision raw hash failure or mixed historical and prospective lineage invalidates the affected association input.
  cost_estimate: {compute: bounded single-game prospective capture, human_days: unresolved}
  dependencies: [X-08]
